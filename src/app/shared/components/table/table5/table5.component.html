<div class="row">
    <div class="col-md-12">
        <h3 class="text-center bg-dark text-white p-3">Book Table</h3>
        <table class="table table-bordered text-center">
            <thead>
                <tr>
                    <th>BookId</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Pages</th>
                    <th>IsAvailable</th>
                    <th>Genre</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let book of books">
                    <td>{{book.bookId}}</td>
                    <td>{{book.title}}</td>
                    <td>{{book.author}}</td>
                    <td>{{book.price}}</td>
                    <td>{{book.pages}}</td>
                    <td>{{book.isAvailable}}</td>
                    <td>{{book.genre}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
