<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="table-responsive">
                <table class="table table-bordered text-center">
                    <thead style="background-color: aquamarine;">
                        <tr>
                            <th>DoctorId</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Experience</th>
                            <th>Fees</th>
                            <th>IsAvailable</th>
                            <th>Hospital</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let doctor of doctorsArr">
                            <td>{{doctor.doctorId}}</td>
                            <td>{{doctor.name}}</td>
                            <td>{{doctor.specialization}}</td>
                            <td>{{doctor.experience}}</td>
                            <td>{{doctor.fees}}</td>
                            <td><span class="badge" [ngClass]="{
                                'bg-success':doctor.isAvailable, 
                                'bg-danger':!doctor.isAvailable }">{{doctor.isAvailable?'Yes':'No'}}</span></td>
                            <td>{{doctor.hospital}}</td>
                            <td>{{doctor.email}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
