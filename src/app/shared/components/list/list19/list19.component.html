<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h4 style="font-weight: bold;">{{dishesText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let dishe of dishes1;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-primary':'bg-secondary text-white'">{{dishe}}</li>
            </ul>
        </div>
    </div>
</div>
