<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h4 style="font-weight: bold;">{{monthsText}}</h4>
            <ul class="list-group">
                <li class="list-group-item text-center" *ngFor="let month of months;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-success':'bg-dark text-white'">{{month}}</li>
            </ul>
        </div>
    </div>
</div>
