<div class="container">
    <div class="row">
        <div class="col-md-6">
            <h3 class="bg-primary p-3 text-white">{{vehiclesText}}</h3>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let vehicles of vehicles; let even1=odd"
                    [ngClass]="even1 ? 'bg-success' : 'bg-danger'">{{vehicles}}</li>
            </ul>
        </div>
    </div>
</div>
