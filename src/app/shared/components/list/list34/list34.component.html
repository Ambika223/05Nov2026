<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h4>{{devToolsText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let devTools of devTools1;let i=index"
                    [ngClass]="(i+1)%2===0?'bg-dark text-white':'bg-info'">{{devTools}}</li>
            </ul>
        </div>
    </div>
</div>
