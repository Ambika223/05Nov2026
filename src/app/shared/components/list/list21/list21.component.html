<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h4>{{planetsText}}</h4>
            <ul class="list-group">
                <li class="list-group-item text-center" *ngFor="let planet of planets;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-primary':'bg-danger'">{{planet}}</li>
            </ul>
        </div>
    </div>
</div>
