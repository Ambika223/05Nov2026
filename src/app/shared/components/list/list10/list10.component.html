<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <h4 style="font-size: 18px;"><b>{{languagesText}}</b></h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let language of languages;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-info':'bg-warning'">
                    {{language}}</li>
            </ul>
        </div>
    </div>
</div>
