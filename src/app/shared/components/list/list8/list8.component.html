<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <h4 style="font-size: 18px;">{{sportsText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let sport of sports;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-danger':''">
                    {{sport}}</li>
            </ul>
        </div>
    </div>
</div>
