<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h4>{{weatherText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let weather of weathers;let i=index"
                    [ngClass]="(i+1)%2===0?'bg-primary':'bg-dark text-white'">{{weather}}</li>


            </ul>
        </div>
    </div>
</div>
