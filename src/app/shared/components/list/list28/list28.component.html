<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <h4>{{webTechText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let webTech of webTech1;let i=index"
                    [ngClass]="(i+1)%2===0?'bg-primary':'bg-secondary'">{{webTech}}</li>
            </ul>
        </div>
    </div>
</div>
