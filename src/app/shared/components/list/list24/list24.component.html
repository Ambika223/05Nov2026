<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <h4 style="font-weight: bold;">{{gadgetsText}}</h4>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let gadget of gadgets;let i=index"
                    [ngClass]="(i+1)%2===0 ? 'bg-primary':'bg-dark text-white'">{{gadget}}</li>
            </ul>
        </div>
    </div>
</div>
