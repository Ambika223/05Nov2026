<p>card16 works!</p>
<h3 class="text-center bg-primary mt-3 p-3">Space Card</h3>
<div class="container">
    <div class="row">
        <div class="col-md-4 mt-3" *ngFor="let space of space1">
            <div class="card h-100">
                <div class="card-header">
                    <h4><b>{{space.field}}</b></h4>
                </div>
                <div class="card-body">
                    <p>{{space.concept}}</p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button mat-mini-fab color="primary" aria-label="Example icon button with a delete icon">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-mini-fab color="warn" aria-label="Example icon button with a delete icon">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
